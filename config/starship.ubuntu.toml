# Starship Prompt Configuration - Ubuntu Flavour
# Canonical Yaru palette: Warm Orange (#E95420) & Aubergine (#77216F)

add_newline = true
command_timeout = 500

format = """
$directory\
$git_branch\
$git_status\
$package\
$golang\
$nodejs\
$rust\
$python\
$docker_context\
$line_break\
$character"""

right_format = """$cmd_duration$os$username$hostname$time"""

[os]
disabled = false
style = "bold #e95420"

[os.symbols]
Ubuntu = " "
Debian = " "
Linux = " "

[username]
show_always = true
format = "[$user]($style)@"
style_user = "bold #e95420"
style_root = "bold #df382c"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold #aea79f"

[character]
success_symbol = "[❯](bold #e95420)"
error_symbol = "[❯](bold #df382c)"
vimcmd_symbol = "[❮](bold #38b44a)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #e95420"
read_only = " 󰌾"
read_only_style = "#df382c"
repo_root_style = "bold #aea79f"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold #77216f"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "#efb73e"
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bold #efb73e"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%T"
style = "dimmed #aea79f"

[package]
symbol = "󰏗 "
style = "#e95420"
format = "via [$symbol$version]($style) "

[python]
symbol = "󰌠 "
style = "#efb73e"
format = "via [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[nodejs]
symbol = "󰎙 "
style = "#38b44a"
format = "via [$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "#00a3e0"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "#e95420"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = "󰡨 "
style = "#00a3e0"
format = "via [$symbol$context]($style) "
