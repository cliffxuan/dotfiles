include /etc/sway/config

xwayland enable
output HEADLESS-1 resolution 1920x1080

exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec hash dbus-update-activation-environment 2>/dev/null && dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP=sway

# --- App Launcher (fuzzel) ---
unbindsym $mod+d
unbindsym $mod+space
bindsym $mod+d exec fuzzel
bindsym $mod+space exec fuzzel
bindsym Mod1+space exec fuzzel
bindsym Mod1+d exec fuzzel

# --- Additional macOS Friendly Shortcuts ---
# Quick terminal (Option + Return in addition to Cmd + Return)
bindsym Mod1+Return exec foot

# Quick window close (Cmd + Q, Option + Q, Option + Shift + Q)
bindsym $mod+q kill
bindsym Mod1+q kill
bindsym Mod1+Shift+q kill

# Fullscreen (Option + F in addition to Cmd + F)
bindsym Mod1+f fullscreen toggle

