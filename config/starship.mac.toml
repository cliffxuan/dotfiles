# Starship Prompt Configuration - macOS Flavour
# Sleek Apple Cupertino palette: Apple Blue (#007AFF), Teal (#5AC8FA), Silver (#A0A0A0)

add_newline = true
command_timeout = 500

format = """
$directory\
$git_branch\
$git_status\
$package\
$golang\
$nodejs\
$rust\
$python\
$docker_context\
$line_break\
$character"""

right_format = """$cmd_duration$os$username$hostname$time"""

[os]
disabled = false
style = "bold #a0a0a0"

[os.symbols]
Macos = " "

[username]
show_always = true
format = "[$user]($style)@"
style_user = "bold #5ac8fa"
style_root = "bold #ff3b30"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold #a0a0a0"

[character]
success_symbol = "[❯](bold #007aff)"
error_symbol = "[❯](bold #ff3b30)"
vimcmd_symbol = "[❮](bold #34c759)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #007aff"
read_only = " 󰌾"
read_only_style = "#ff3b30"
repo_root_style = "bold #5ac8fa"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold #af52de"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "#ffcc00"
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bold #ffcc00"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%T"
style = "dimmed #8e8e93"

[package]
symbol = "󰏗 "
style = "#5ac8fa"
format = "via [$symbol$version]($style) "

[python]
symbol = "󰌠 "
style = "#ff9500"
format = "via [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[nodejs]
symbol = "󰎙 "
style = "#34c759"
format = "via [$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "#5ac8fa"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "#ff9500"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = "󰡨 "
style = "#007aff"
format = "via [$symbol$context]($style) "
